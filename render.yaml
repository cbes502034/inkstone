# Render 部署設定。
#
# 前端是純靜態檔，走 Static Site（不會休眠、免費）。
# 後端是 Web Service，免費方案閒置 15 分鐘會休眠，
# 下一個請求要等 30~50 秒喚醒 —— 上線前要處理，見 DEPLOY.md。

services:
  # ---------------------------------------------------------------- 後端
  - type: web
    name: inkstone-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend

    # 建置階段只裝套件。
    # migration 移到啟動時執行 —— 建置環境不該連生產資料庫，
    # 而且該階段環境變數不保證已就緒，是部署失敗的常見原因。
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: ENV
        value: prod
      - key: PYTHON_VERSION
        value: "3.12.7"
      # 讓 Render 產生一組夠強的密鑰，不需要人工填也不會外流
      - key: JWT_SECRET
        generateValue: true

      # 以下在 Render 後台手動填，不要寫進這個檔案（它會進版控）
      #
      # DATABASE_URL 必須用 Supabase 的 connection pooler，不能用直連：
      #   直連 db.<ref>.supabase.co 是 IPv6-only，
      #   Render 免費方案沒有 IPv6 對外，會直接連不上。
      #   到 Supabase → Connect → 選 Session pooler，格式類似
      #   postgresql://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
      - key: DATABASE_URL
        sync: false
      # 前端網址。不是機密，直接寫在這裡由 Blueprint 同步，
      # 比在後台手動維護可靠 —— 改網址時跟著程式碼一起版控
      - key: CORS_ORIGINS
        value: https://inkstone-web.onrender.com
      - key: REDIS_URL
        sync: false
      - key: HF_TOKEN
        sync: false

      # 驗證信裡的連結要指向前端，沒設會指到 localhost
      - key: FRONTEND_URL
        value: https://inkstone-web.onrender.com

      # 寄信。
      #
      # 不能用 SMTP —— Render 封鎖對外的 SMTP 連接埠（25/465/587）來防垃圾郵件，
      # 不管帳密多正確都會得到 OSError: Network is unreachable。
      # 必須用走 HTTPS 的寄信 API。
      #
      # Brevo 免費方案每天 300 封，只要驗證寄件信箱、不需要自有網域，
      # 對還沒有網域的專案最合適。金鑰只填在後台。
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        value: cbes502034@gmail.com

  # ---------------------------------------------------------------- 前端
  - type: web
    name: inkstone-web
    # 靜態網站由全球 CDN 供應，不能也不需要指定 region
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    envVars:
      # 後端網址。inkstone-api 這個名稱在 Render 上已被佔用，
      # 所以實際主機名多了隨機後綴，不能照名稱推測
      - key: VITE_API_BASE_URL
        value: https://inkstone-api-kbhs.onrender.com/api/v1

    routes:
      # SPA：所有路徑都交給 index.html，
      # 否則直接開 /post/xxx 或重新整理會 404
      - type: rewrite
        source: /*
        destination: /index.html
