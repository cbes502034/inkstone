# 定期喚醒後端，減少訪客遇到冷啟動。
#
# Render 免費方案閒置約 15 分鐘就會休眠，下一個請求要等它整個開機 ——
# 使用者看到的是一個轉很久的空白畫面。前端雖然有等待提示，
# 但最好的體驗是根本不用等。
#
# 為什麼不是整天都 ping：
#   免費方案每月有 750 個執行小時。全天候保溫要 730 小時，
#   額度剛好卡在邊緣，任何一次多開就會超出。
#   這裡只在台灣時間 08:00–01:00 保溫（UTC 00:00–17:00），
#   約 520 小時，留下足夠餘裕。凌晨本來也沒什麼訪客。
#
# 這個排程只對公開倉庫免費。倉庫若改成私有，
# 這個工作會開始消耗 Actions 分鐘數，屆時請改用外部的監控服務。

name: keep-warm

on:
  schedule:
    # 每 10 分鐘一次，涵蓋 UTC 00:00–17:00
    - cron: '*/10 0-17 * * *'
  # 也可以手動觸發，用來確認設定有沒有生效
  workflow_dispatch:

# 只保留最新一次，排程延遲時不要堆積
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 喚醒後端
        run: |
          # 冷啟動可能要 50 秒以上，逾時放寬到 90 秒。
          # --fail 讓非 2xx 直接視為失敗，這樣服務真的掛掉時，
          # 這個工作會變紅 —— 等於順便有了一個最低限度的監控。
          curl --fail --silent --show-error --max-time 90 \
            https://inkstone-api-kbhs.onrender.com/health
